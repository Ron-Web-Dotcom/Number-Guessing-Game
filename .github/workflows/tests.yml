name: Tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore
        run: dotnet restore NumberGuessingTests/NumberGuessingTests.csproj

      - name: Test
        run: dotnet test NumberGuessingTests/NumberGuessingTests.csproj --no-restore --verbosity normal
